<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#203b31">
  <meta name="description" content="Dinner is cancelled. Help Tom outrun Farmer Bram in a hand-drawn Thanksgiving escape.">
  <title>Gobble Run — The Great Thanksgiving Escape</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main aria-label="Gobble Run: The Great Thanksgiving Escape">
    <canvas id="game" width="1280" height="800" tabindex="0" aria-label="Turkey escape runner. Enter to start, Space to jump, Down to slide or hide, Shift to dash, P to pause, M to mute, R to restart."></canvas>
    <p class="sr-only" id="status" role="status" aria-live="polite">Dinner is cancelled. Press Enter or click Let's Fly to begin.</p>
    <section class="sr-only" aria-label="Instructions">
      <h1>Gobble Run: The Great Thanksgiving Escape</h1>
      <p>Jump fences, slide below knives, dash through one obstacle, and hide in haystacks. Reach the forest at 2400 metres. Keep three hearts and keep your distance from Farmer Bram.</p>
      <button id="accessible-start">Start or restart</button>
      <button id="accessible-pause">Pause or resume</button>
      <button id="accessible-mute">Toggle sound</button>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
